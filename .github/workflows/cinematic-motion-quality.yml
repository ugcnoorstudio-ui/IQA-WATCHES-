name: Cinematic motion quality checks

on:
  push:
    branches:
      - feature/cinematic-3d-motion-engine-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/cinematic-story.js
          node --check admin/motion-studio.js
          node --check admin/asset-intake.js
          node --check admin/model-viewer.js
          node --check admin/admin.js
          node --check admin/auth.js
          node --check routes.js
      - name: Run asset intake tests
        run: node --test tests/asset-intake.test.js
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
