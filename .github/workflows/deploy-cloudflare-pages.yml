name: Deploy IQA WATCHES to Cloudflare Pages

on:
  # Every main merge is test-gated before the Cloudflare production upload.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PAGES_PROJECT: iqa-watches-storefront

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/cinematic-story.js
          node --check admin/motion-studio.js
          node --check admin/asset-intake.js
          node --check admin/model-viewer.js
          node --check admin/admin.js
          node --check admin/auth.js
          node --check routes.js
          node --check customer-storefront.js
      - name: Run unit and regression tests
        run: node --test tests/*.test.js
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npx playwright test

  deploy:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tested main commit
        uses: actions/checkout@v4
      - name: Validate credentials and create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN (Pages Write token)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test -s index.html
          test -s admin/index.html
          test -s data/catalogue.json

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT"
          RESPONSE="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")"
          HTTP_STATUS="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "$BODY" | jq -e '.success == true' >/dev/null
            echo "Cloudflare Pages project already exists."
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "Creating Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT..."
            CREATE_BODY="$(jq -n --arg name "$CLOUDFLARE_PAGES_PROJECT" '{name:$name, production_branch:"main", build_config:{build_command:"exit 0", destination_dir:"."}}')"
            CREATE_RESPONSE="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$CREATE_BODY")"
            echo "$CREATE_RESPONSE" | jq -e '.success == true' >/dev/null || { echo "$CREATE_RESPONSE" | jq -r '.errors[]?.message // "Cloudflare project creation failed"'; exit 1; }
          else
            echo "$BODY" | jq -r '.errors[]?.message // "Could not inspect Cloudflare Pages project"'
            exit 1
          fi
      - name: Deploy tested main commit to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy . --project-name=iqa-watches-storefront --branch=main
      - name: Verify deployed Cloudflare Pages site
        env:
          IQA_STOREFRONT_URL: https://iqa-watches-storefront.pages.dev/
        run: node scripts/monitor-public-health.js
