name: Deploy IQA WATCHES to Cloudflare Pages

on:
  # Deliberately manual until the Cloudflare project and protected credentials
  # have been configured and the first production deploy has been reviewed.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/cinematic-story.js
          node --check admin/motion-studio.js
          node --check admin/asset-intake.js
          node --check admin/model-viewer.js
          node --check admin/admin.js
          node --check admin/auth.js
          node --check routes.js
          node --check customer-storefront.js
      - name: Run unit and regression tests
        run: node --test tests/*.test.js
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npx playwright test

  deploy:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-production
    steps:
      - name: Check out tested main commit
        uses: actions/checkout@v4
      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the CLOUDFLARE_API_TOKEN Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add the CLOUDFLARE_ACCOUNT_ID Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "::error::Add the CLOUDFLARE_PAGES_PROJECT Actions variable."; exit 1; }
          test -s index.html
          test -s admin/index.html
          test -s data/catalogue.json
      - name: Deploy to Cloudflare Pages production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy . --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
      - name: Verify deployed Cloudflare Pages site
        env:
          IQA_STOREFRONT_URL: https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev/
        run: node scripts/monitor-public-health.js
