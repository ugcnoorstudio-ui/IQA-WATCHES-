name: Provision and deploy IQA WATCHES staging API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/deploy-cloudflare-staging.yml'
      - 'cloudflare/**'
      - 'supabase/functions/iqa-public-content/**'
      - 'supabase/functions/iqa-public-catalogue/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare-staging.yml'
      - 'cloudflare/**'
      - 'supabase/functions/iqa-public-content/**'
      - 'supabase/functions/iqa-public-catalogue/**'

permissions:
  contents: read

concurrency:
  group: iqa-watches-cloudflare-staging
  cancel-in-progress: false

jobs:
  test-staging:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker tests
        run: |
          node --check src/index.js
          npm test

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: test-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IQA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IQA_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing IQA_CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing IQA_CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          test -s cloudflare/src/index.js
          grep -q '^SUPABASE_URL = ' cloudflare/wrangler.toml
          grep -q '^SUPABASE_PUBLISHABLE_KEY = ' cloudflare/wrangler.toml
      - name: Deploy Supabase-connected staging Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IQA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IQA_CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml
      - name: Verify staging Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://iqa-watches-api-staging.ugcnoorstudio.workers.dev/healthz"
          RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL")"
          printf '%s' "$RESPONSE" | jq -e '.ok == true and .environment == "staging"'
      - name: Verify Staging Supabase public function upstreams
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^SUPABASE_URL = "\(.*\)"/\1/p' cloudflare/wrangler.toml)"
          SUPABASE_KEY="$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY = "\(.*\)"/\1/p' cloudflare/wrangler.toml)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          for FUNCTION in "iqa-public-content" "iqa-public-catalogue"; do
            BODY="$(mktemp)"
            STATUS="$(curl --silent --show-error -o "$BODY" -w '%{http_code}' \
              -H "apikey: $SUPABASE_KEY" -H "accept: application/json" \
              "$SUPABASE_URL/functions/v1/$FUNCTION")"
            echo "Staging upstream $FUNCTION returned HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              cat "$BODY"
              rm -f "$BODY"
              exit 1
            fi
            jq -e '.ok == true' "$BODY" >/dev/null
            rm -f "$BODY"
          done
      - name: Verify public API edge cache and CORS isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://iqa-watches-api-staging.ugcnoorstudio.workers.dev"
          ORIGINS=("https://ugcnoorstudio-ui.github.io" "https://iqa-watches-storefront.pages.dev")
          for ROUTE in "/api/v1/public-content" "/api/v1/catalogue"; do
            for ORIGIN in "${ORIGINS[@]}"; do
              FIRST_HEADERS="$(mktemp)"
              FIRST_BODY="$(mktemp)"
              SECOND_HEADERS="$(mktemp)"
              SECOND_BODY="$(mktemp)"
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -D "$FIRST_HEADERS" -o "$FIRST_BODY" -H "Origin: $ORIGIN" "$BASE$ROUTE"
              jq -e '.ok == true' "$FIRST_BODY"
              grep -iqF "access-control-allow-origin: $ORIGIN" "$FIRST_HEADERS"
              curl --fail --silent --show-error --retry 3 --retry-delay 2 \
                -D "$SECOND_HEADERS" -o "$SECOND_BODY" -H "Origin: $ORIGIN" "$BASE$ROUTE"
              jq -e '.ok == true' "$SECOND_BODY"
              grep -iqF "access-control-allow-origin: $ORIGIN" "$SECOND_HEADERS"
              if ! grep -iqE '^cf-cache-status: (HIT|REVALIDATED)' "$SECOND_HEADERS"; then
                echo "::error::Expected an edge cache HIT for $ROUTE and $ORIGIN."
                cat "$SECOND_HEADERS"
                exit 1
              fi
              rm -f "$FIRST_HEADERS" "$FIRST_BODY" "$SECOND_HEADERS" "$SECOND_BODY"
            done
          done
          PREFLIGHT_HEADERS="$(mktemp)"
          PREFLIGHT_STATUS="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -D "$PREFLIGHT_HEADERS" -X OPTIONS \
            -H "Origin: https://iqa-watches-storefront.pages.dev" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: apikey" \
            "$BASE/api/v1/public-content")"
          test "$PREFLIGHT_STATUS" = "204"
          grep -iqF "access-control-max-age: 86400" "$PREFLIGHT_HEADERS"
          rm -f "$PREFLIGHT_HEADERS"
