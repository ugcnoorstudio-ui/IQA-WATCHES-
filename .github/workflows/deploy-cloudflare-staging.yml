name: Provision and deploy IQA WATCHES staging API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare-staging.yml'
      - 'cloudflare/**'

permissions:
  contents: read

concurrency:
  group: iqa-watches-cloudflare-staging
  cancel-in-progress: false

jobs:
  test-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker tests
        run: |
          node --check src/index.js
          npm test

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: test-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IQA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IQA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing IQA_CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing IQA_CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          test -n "$CLOUDFLARE_WORKERS_SUBDOMAIN" || { echo "::error::Set repository variable CLOUDFLARE_WORKERS_SUBDOMAIN."; exit 1; }
          test -s cloudflare/migrations/0001_staging_bootstrap.sql
          grep -q 'REPLACE_WITH_STAGING_D1_DATABASE_ID' cloudflare/wrangler.toml
      - name: Create or reuse staging D1 and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IQA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IQA_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          DB_JSON="$(curl --fail --silent --show-error --request GET "$API_BASE" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json")"
          DB_ID="$(printf '%s' "$DB_JSON" | jq -r '[.result[]? | select(.name == "iqa-watches-staging")][0].uuid // empty')"
          if [ -z "$DB_ID" ]; then
            CREATE_JSON="$(curl --fail --silent --show-error --request POST "$API_BASE" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data '{"name":"iqa-watches-staging"}')"
            DB_ID="$(printf '%s' "$CREATE_JSON" | jq -r '.result.uuid // empty')"
          fi
          [[ "$DB_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Could not resolve a valid staging D1 database UUID."; exit 1; }
          sed "s/REPLACE_WITH_STAGING_D1_DATABASE_ID/$DB_ID/" wrangler.toml > wrangler.deploy.toml
          wrangler d1 migrations apply iqa-watches-staging --remote --config wrangler.deploy.toml
          wrangler deploy --config wrangler.deploy.toml
      - name: Verify staging Worker health endpoint
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="${CLOUDFLARE_WORKERS_SUBDOMAIN#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          if [[ "$HOST" == *.workers.dev ]]; then
            HOST="${HOST#*.}"
            HOST="${HOST%.workers.dev}"
          fi
          [[ "$HOST" =~ ^[a-z0-9-]+$ ]] || { echo "::error::CLOUDFLARE_WORKERS_SUBDOMAIN must identify the workers.dev account subdomain."; exit 1; }
          URL="https://iqa-watches-api-staging.$HOST.workers.dev/healthz"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL" | jq -e '.ok == true and .environment == "staging"'
