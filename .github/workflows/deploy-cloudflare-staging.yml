name: Provision and deploy IQA WATCHES staging API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iqa-watches-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/migration/cloudflare-d1-workers-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout staging migration branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}" || { echo "::error::Set repository variable CLOUDFLARE_WORKERS_SUBDOMAIN before deployment."; exit 1; }
          node --check cloudflare/src/index.js
          test -s cloudflare/migrations/0001_staging_bootstrap.sql
      - name: Create or reuse staging D1 and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          DB_JSON="$(wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$DB_JSON" | jq -r '.[] | select(.name == "iqa-watches-staging") | .uuid' | head -n 1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_OUTPUT="$(wrangler d1 create iqa-watches-staging --json)"
            DB_ID="$(printf '%s' "$CREATE_OUTPUT" | jq -r '.uuid // .result.uuid // empty')"
          fi
          test -n "$DB_ID" || { echo "::error::Could not resolve staging D1 database ID."; exit 1; }
          sed "s/REPLACE_WITH_STAGING_D1_DATABASE_ID/$DB_ID/" wrangler.toml > /tmp/iqa-wrangler.toml
          cp /tmp/iqa-wrangler.toml wrangler.toml
          wrangler d1 migrations apply iqa-watches-staging --remote
          wrangler deploy --config wrangler.toml
      - name: Verify staging Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://iqa-watches-api-staging.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/healthz"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL" | jq -e '.ok == true and .environment == "staging"'
