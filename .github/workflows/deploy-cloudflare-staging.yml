name: Provision and deploy IQA WATCHES staging API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iqa-watches-cloudflare-staging
  cancel-in-progress: false

jobs:
  test-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker tests
        run: |
          node --check src/index.js
          npm test

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: test-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IQA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IQA_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing IQA_CLOUDFLARE_API_TOKEN secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing IQA_CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          test -n "$CLOUDFLARE_WORKERS_SUBDOMAIN" || { echo "::error::Set repository variable CLOUDFLARE_WORKERS_SUBDOMAIN."; exit 1; }
          test -s cloudflare/migrations/0001_staging_bootstrap.sql
          grep -q 'REPLACE_WITH_STAGING_D1_DATABASE_ID' cloudflare/wrangler.toml
      - name: Create or reuse staging D1 and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.IQA_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IQA_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          DB_JSON="$(wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$DB_JSON" | jq -r '.. | objects | select(.name? == "iqa-watches-staging") | .uuid // empty' | head -n 1)"
          if [ -z "$DB_ID" ]; then
            CREATE_OUTPUT="$(wrangler d1 create iqa-watches-staging --json)"
            DB_ID="$(printf '%s' "$CREATE_OUTPUT" | jq -r '.. | objects | select(has("uuid")) | .uuid' | head -n 1)"
          fi
          [[ "$DB_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Could not resolve a valid staging D1 database UUID."; exit 1; }
          sed "s/REPLACE_WITH_STAGING_D1_DATABASE_ID/$DB_ID/" wrangler.toml > wrangler.deploy.toml
          wrangler d1 migrations apply iqa-watches-staging --remote --config wrangler.deploy.toml
          wrangler deploy --config wrangler.deploy.toml
      - name: Verify staging Worker health endpoint
        env:
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://iqa-watches-api-staging.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev/healthz"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL" | jq -e '.ok == true and .environment == "staging"'
