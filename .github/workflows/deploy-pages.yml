name: Deploy IQA WATCHES to GitHub Pages

on:
  # Production releases are manual-only; pull request merges never deploy.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  queue: max

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Validate static website entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s routes.js
          test -s admin/index.html
          test -s assets/cinematic-story.js
          test -f .nojekyll
          echo "IQA WATCHES static-site entry points are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
