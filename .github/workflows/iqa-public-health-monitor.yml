name: IQA WATCHES recurring public health monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iqa-public-health-monitor
  cancel-in-progress: true

jobs:
  public-health:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check storefront, admin shell and static Cloudinary catalogue
        run: node scripts/monitor-public-health.js
